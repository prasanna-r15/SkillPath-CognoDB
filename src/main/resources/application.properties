spring.application.name=skillpath
server.port=${PORT:8084}
spring.thymeleaf.cache=false

# CognoDB credentials are intentionally read from environment variables.
cognodb.uri=${COGNODB_URI:bolt://localhost:7687}
cognodb.username=${COGNODB_USERNAME:cognodb}
cognodb.password=${COGNODB_PASSWORD:change-me}
cognodb.database=${COGNODB_DATABASE:neo4j}

# Avoid exposing credentials in logs.
logging.level.org.neo4j.driver=WARN
